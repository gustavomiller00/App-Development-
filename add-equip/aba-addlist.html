<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="addlist.css">
    <title>Document</title>
</head>
<body>

<!-- Modal de cadastro -->
<div class="sombra-modal" id="modalEquipamento">

    
    <div class="modal-container">
        
        <div class="modal-header">
            <button id="fecharModal"><strong><</strong></button>
            <p>MEU MEDIDOR</p>
            <button id="fecharModal">✕</button>
        </div>

        <div class="modal-content">

            <div class="form-group">
                <label for="escolherIcone">Escolha um ícone</label>
                <div class="icon-options">
                    <div class="icon-option" data-icon="icon1">Icon 1</div>
                    <div class="icon-option" data-icon="icon2">Icon 2</div>
                    <div class="icon-option" data-icon="icon3">Icon 3</div>
                    <div class="icon-option" data-icon="icon4">Icon 4</div>
                    <div class="icon-option" data-icon="icon5">Icon 5</div>
                    <!-- Adicione mais ícones conforme necessário -->
                </div>
            </div>
            
            <div class="form-group">
                <label for="nomeEquipamento">Nome do equipamento:</label>
                <input type="text" id="nomeEquipamento" name="nomeEquipamento">
            </div>

            <div class="form-group">
                <label for="descricaoEquipamento">Descrição do equipamento:</label>
                <textarea id="descricaoEquipamento" name="descricaoEquipamento"></textarea>
            </div>

            <div class="form-group">
                <label for="quantidadeEquipamento">Quantidade:</label>
                <input type="number" id="quantidadeEquipamento" name="quantidadeEquipamento">
            </div>

            <div class="form-group">
                <label for="localizacaoEquipamento">Localização:</label>
                <input type="text" id="localizacaoEquipamento" name="localizacaoEquipamento">
            </div>

        </div>

        <div class="modal-footer">
            <button id="btnAdicionarCriando" class="btn-adicionar">+ Adicionar equipamento</button>
        </div>

    </div> <!-- Fim do container do modal -->

<script src="../js/aba-addlist.js"></script>
    
</body>
</html>
