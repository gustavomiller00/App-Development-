<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="addlist.css">
    <title>Document</title>
</head>
<body>

<!-- Modal de cadastro -->
<div class="sombra-modal" id="modalEquipamento">

    
    <div class="modal-container">
        
        <div class="modal-header">
            <button class="fecharModal"><i class="fa-solid fa-angle-left"></i></button>
            <p>MEU MEDIDOR</p>
            <button class="fecharModal"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <div class="modal-content">

            <h2>Adicione um equipamento</h2>

            <div class="form-group">
                <label for="escolherIcone">Escolha um ícone</label>
                <div class="icon-options">
                    
                    <a class="icon-option" data-icon="icon1" type="button"><i class="fa-solid fa-plug"></i></a>

                    <a class="icon-option" data-icon="icon2" type="button"><i class="fa-regular fa-lightbulb"></i> </a>

                    <a class="icon-option" data-icon="icon3" type="button"><i class="fa-solid fa-power-off"></i></i></a>

                    <a class="icon-option" data-icon="icon4" type="button"><i class="fa-solid fa-bolt"></i></a>

                    <a class="icon-option" data-icon="icon5" type="button"><i class="fa-regular fa-house"></i></a>
                    <!-- Adicione mais ícones conforme necessário -->
                </div>
            </div>
            
            <div class="form-group">
                <label for="nomeEquipamento">Nome do equipamento:</label>
                <input type="text" id="nomeEquipamento" name="nomeEquipamento">
            </div>

            <div class="form-group">
                <label for="potenciaEquipamento">Potência do equipamento (W):</label>
                <input type="number" id="potenciaEquipamento" name="potenciaEquipamento" min="0" max="9999999">
            </div>

            <div class="form-group">
                <label for="horasPorDia">Horas ativas por dia:</label>
                <input type="number" id="horasPorDia" name="horasPorDia" min="0" max="24">
            </div>

            <div class="form-group">
                <label for="horarioInicio">Horário de início da utilização (0 a 23):</label>
                <input type="number" id="horarioInicio" name="horarioInicio" min="0" max="23">
            </div>

        </div>

        <div class="modal-footer">
            <button id="btnAdicionarCriando" class="btn-adicionar">+ Adicionar equipamento</button>
        </div>

    </div> <!-- Fim do container do modal -->

<script src="https://kit.fontawesome.com/17950525a6.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script src="../js/aba-addlist.js"></script>
    
</body>
</html>
