<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="img/download.gif" type="gif">
    <title>Login / Beta Development App 0.01v</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
</head>

<body>

<section id="loginPage">
    
    
    <div class="login-card">
        
        <div class="top-login-text">
            <img class="logo-top">
            <span class="login-text">
                Olá, Bem vindo de volta!
            </span>
        </div>
        
        <div class="input-group">
            <input type="text" required>
            <label for="">Email</label>
        </div>

        <div class="input-group">
            <input type="password" required>
            <label for="">Senha</label>
        </div>

        <div class="org-lw">
            <div class="lw-button" alt="apple-icon">
                <i class="fa-brands fa-apple"></i>
            </div>

            <div class="lw-button" alt="gmail-icon">
                <i class="fa-brands fa-google"></i>
            </div>

            <div class="lw-button" alt="fb-icon">
                <i class="fa-brands fa-facebook"></i>
            </div>
        </div>

    </div>

    <!-- lw-button = Login With -->
    <!-- Adicionar nome, senha, cadastro, login com e etc.. -->


</section>

</body>

<script src="https://kit.fontawesome.com/17950525a6.js" crossorigin="anonymous"></script>
</html>
