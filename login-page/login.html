<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="icon" href="login-page/logo.gif" type="gif">
    <title>Login / Beta Development App 0.01v</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
</head>

<body>

<section id="loginPage">

    
    
    <div class="login-card">
        
        <div class="header-login">
            <img class="logo-top" src="login-page/logos.gif" alt="Logo do App">
            <span class="login-text">
                Faça login ou crie sua conta
            </span>
        </div>
        
        <div class="input-group">
            <input type="text" required>
            <label for="">Email</label>
        </div>

        <div class="input-group">
            <input type="password" required>
            <label for="">Senha</label>
            <a href="https://github.com/gustavomiller00" class="pass-forgot">Esqueceu a senha?</a>
        </div>

        
            <a class="text-or">ou,  faça login com</a>
        

        <div class="org-lw">
            
                <a class="lw-button" href="https://github.com/gustavomiller00" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-apple"></i></a>
            
                <a class="lw-button" href="https://github.com/gustavomiller00" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-google"></i></a>
            
                <a class="lw-button" href="https://github.com/gustavomiller00" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-facebook"></i></a>
            
        </div>

        <div class="org-login">
            <a class="button-registrar" href="https://">Criar conta</a>
            <a class="button-login" href="https://">Avançar</a>
        </div>

    </div>

    <!-- lw-button = Login With -->
    <!-- Adicionar nome, senha, cadastro, login com e etc.. -->


</section>

</body>

<script src="https://kit.fontawesome.com/17950525a6.js" crossorigin="anonymous"></script>
</html>
